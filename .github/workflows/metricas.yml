name: Métricas do GACE-PPSI

# Arquiva semanalmente os agregados que o GitHub disponibiliza sobre o repositório
# (visitas, clones, downloads de releases, estrelas/forks), antes que o tráfego
# expire — a API só guarda os últimos 14 dias. Nenhum dado de usuários é coletado:
# somente os totais que o próprio GitHub já produz. Nada aqui toca o aplicativo,
# as releases ou o versionamento (v1.1.1 permanece intocada).

on:
  schedule:
    - cron: '17 6 * * 1'    # toda segunda-feira, 06:17 UTC (03:17 em Brasília)
  workflow_dispatch:         # habilita o botão "Run workflow" na aba Actions

permissions:
  contents: write            # necessário para gravar os CSVs na pasta metrics/

jobs:
  coletar-e-arquivar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Coletar métricas
        env:
          GH_TOKEN: ${{ secrets.TRAFEGO_TOKEN }}
        run: python3 .github/scripts/coletar_metricas.py

      - name: Gravar os CSVs no repositório
        run: |
          git config user.name "gace-metricas"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/
          if git diff --cached --quiet; then
            echo "Nada novo para gravar."
          else
            git commit -m "métricas: atualização automática de $(date -u +%F)"
            git push
          fi
